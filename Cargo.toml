[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Hanziness/mddb"
readme = "README.md"
description = "Knowledge base management for Markdown - search, link, and lint"
keywords = ["markdown", "search", "knowledge-base", "fts5", "sqlite"]
authors = ["Hanziness"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"        # saves unwinding tables; fine for a CLI that exits on error anyway