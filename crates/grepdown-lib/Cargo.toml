[package]
name = "grepdown-lib"
version.workspace = true
edition.workspace = true
description = "Core library for grepdown: SQLite-backed Markdown indexing, FTS5 search, and link-graph traversal"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["database-implementations", "text-processing"]

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.18"
log = "0.4"
rayon = "1.12.0"
ignore = "0.4"
blake3 = "1.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
pulldown-cmark = "0.13"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "search"
harness = false