[package]
name = "grepdown-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server for grepdown: exposes Markdown knowledge base search, traversal, and linting to AI agents over stdio"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["api-bindings"]

[[bin]]
name = "grepdown-mcp"
path = "src/main.rs"

[dependencies]
grepdown-lib = { path = "../grepdown-lib", version = "0.1" }
rmcp = { version = "2.2.0", features = ["server"] }
clap = { version = "4.6.2", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.1", features = ["io-std", "sync"] }
serde = "1.0.229"
schemars = "1.2.1"
anyhow = "1.0.104"
notify = "6.1"

[dev-dependencies]
rmcp = { version = "2.2.0", features = ["server", "client"] }
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread"] }
tempfile = "3"