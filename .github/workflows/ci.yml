name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

  commit-lint:
    name: Conventional commit title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR title matches conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|refactor|perf|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title '$PR_TITLE' does not follow conventional commits format."
            echo "Expected: type(scope): description"
            echo "Allowed types: feat, fix, refactor, perf, docs, test, build, ci, chore, revert"
            echo "Add '!' after the type (or a 'BREAKING CHANGE:' footer) for breaking changes."
            exit 1
          fi